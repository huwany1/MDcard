[package]
name = "mdcard"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A calm, Mac-inspired Markdown editor for Windows and Linux"
license = "AGPL-3.0-only"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13.3"
egui_commonmark = { version = "0.22", path = "vendor/egui_commonmark", features = ["better_syntax_highlighting", "fetch"] }
egui_extras = { version = "0.33.3", features = ["file", "image", "syntect"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.15"
tempfile = "3"
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "23.0"
encoding_rs = "0.8.35"
chardetng = "0.1.17"
base64 = "0.22"
regex = "1.12"
regex-automata = "0.4"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
tree-sitter = "0.26"
tree-sitter-md = "0.5.3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
globset = "0.4"
resvg = {version="0.45.1",default-features=false,features=["text"]}

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
strip = true

