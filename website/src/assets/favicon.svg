<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">MDcard — color</title>
  <desc id="desc">A rounded portrait card with a transparent geometric M cutout. The outside of the card and the M are genuinely transparent.</desc>
  <defs>
    <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" style="mask-type:luminance">
      <rect x="8" y="4" width="48" height="56" rx="12" fill="#FFFFFF"/>
      <polyline points="20,43 20,22 32,34 44,22 44,43" fill="none" stroke="#000000" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="8" y="4" width="48" height="56" rx="12" fill="#2D5BCA" mask="url(#cutout)"/>
</svg>
