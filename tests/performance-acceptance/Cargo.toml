[package]
license = "AGPL-3.0-only"
name = "large-document-independent-acceptance"
version = "0.0.0"
edition = "2024"

[dependencies]
egui = "=0.33.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "23.0"
tempfile = "3"
encoding_rs = "0.8.35"
chardetng = "0.1.17"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
tree-sitter = "0.26"
tree-sitter-md = "0.5.3"

unicode-segmentation = "=1.13.3"
egui_commonmark = { path = "../../vendor/egui_commonmark", features = ["pulldown_cmark"] }
