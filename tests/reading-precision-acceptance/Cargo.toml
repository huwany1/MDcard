[package]
license = "AGPL-3.0-only"
name = "reading-precision-independent-acceptance"
version = "0.0.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "=0.13.4"
unicode-segmentation = "=1.13.3"
egui = "=0.33.3"
egui_commonmark = { path = "../../vendor/egui_commonmark", features = ["better_syntax_highlighting"] }

[[bin]]
name = "precision-independent-corpus"
path = "src/main.rs"
