<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="title desc">
  <title id="title">MDcard — color 24px optical</title>
  <desc id="desc">A rounded portrait card with a transparent geometric M cutout. The outside of the card and the M are genuinely transparent.</desc>
  <defs>
    <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24" style="mask-type:luminance">
      <rect x="3" y="1.5" width="18" height="21" rx="4.5" fill="#FFFFFF"/>
      <polyline points="7.5,16.5 7.5,8.25 12,12.75 16.5,8.25 16.5,16.5" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="3" y="1.5" width="18" height="21" rx="4.5" fill="#2D5BCA" mask="url(#cutout)"/>
</svg>
