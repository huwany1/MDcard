<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">MDcard — black 32px optical</title>
  <desc id="desc">A rounded portrait card with a transparent geometric M cutout. The outside of the card and the M are genuinely transparent.</desc>
  <defs>
    <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32" style="mask-type:luminance">
      <rect x="4" y="2" width="24" height="28" rx="6" fill="#FFFFFF"/>
      <polyline points="10,22 10,11 16,17 22,11 22,22" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="4" y="2" width="24" height="28" rx="6" fill="#000000" mask="url(#cutout)"/>
</svg>
