<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title desc">
  <title id="title">MDcard — black 16px optical</title>
  <desc id="desc">A rounded portrait card with a transparent geometric M cutout. The outside of the card and the M are genuinely transparent.</desc>
  <defs>
    <mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16" style="mask-type:luminance">
      <rect x="2" y="1" width="12" height="14" rx="3" fill="#FFFFFF"/>
      <polyline points="5,11 5,5.5 8,8.5 11,5.5 11,11" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="2" y="1" width="12" height="14" rx="3" fill="#000000" mask="url(#cutout)"/>
</svg>
